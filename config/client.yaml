# ReVPN client configuration
# Use with:  ./ReVPN.sh --client --config ./config/client.yml
# Any flag you also pass on the command line overrides the value below.

# Address of the ReVPN server to join
connect: "203.0.113.10:9000"

# This node's VPN IP
vpn_ip: "10.13.0.2"

# VPN network prefix length
subnet: 16

# Local UDP port (blank = engine default, 51820)
port: ""

# Fixed 32-bit node id, hex (blank = derived from vpn_ip)
node_id: ""

# TUN interface MTU
mtu: 1380

# Encrypt tunnel traffic. true/false
encrypt: true

# true = never attempt UDP hole punching, always relay through the server
# false (default) = try direct hole punching first, auto-relay on failure
relay_only: false
