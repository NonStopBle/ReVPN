# ReVPN server configuration
# Use with:  ./ReVPN --server --config ./config/server.yaml
# Any flag you also pass on the command line overrides the value below.

# UDP port to listen on
port: 9000

# Server worker threads (SO_REUSEPORT, one socket per worker)
workers: 4

# AF_XDP zero-copy NIC (blank = off, uses recvmmsg). Only takes effect if
# the engine was built with: ./build.sh --xdp
xdp_iface: ""

# Force AF_XDP copy-mode (compat, slower). true/false
xdp_copy: false
